name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Xcode 27 image (macOS 27, Swift 6.4 — the toolchain the sources are developed
    # against; 6.3 rejects some 6.4 syntax and has its own type-checker crash).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      # Every UI string is a Chinese-keyed lookup; this catches keys with no English value,
      # translations that lost a format specifier, and call sites hiding a key behind an
      # expression. LocalizationTests covers the same ground from inside `swift test`.
      - name: Check translation catalog
        run: python3 tools/l10n_catalog.py check

      # Bundled before the tests so a run with a failing test still leaves a runnable .app
      # to try out. build-app.sh's own `swift build -c release` is a no-op here.
      - name: Build app bundle
        run: |
          chmod +x build-app.sh
          ./build-app.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ntfyx-app
          # A glob rather than the literal directory, so the zip keeps the ntfyx.app folder
          # instead of dropping its Contents/ straight at the artifact root.
          path: .build/release/*.app
          if-no-files-found: error

      # `taskpolicy -B` matters: the runner's shell context carries background-task
      # policy, and at that priority the Swift runtime switches the async task
      # allocator, making XCTest's async error-observation path abort the whole test
      # process with "freed pointer was not the last allocation" (reproduced locally
      # with `taskpolicy -b`; `-B` cancels it; see ExpectationWaiting.swift).
      - name: Run tests
        run: |
          set -o pipefail
          taskpolicy -B swift test 2>&1 | tee test-output.txt

      # A test-crash (signal 6) leaves a .ips crash report with the aborting stack;
      # collect it so the run can be debugged after the fact.
      - name: Collect crash reports
        if: failure()
        run: |
          sleep 8
          mkdir -p crash-reports
          find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
            -name '*.ips' -mmin -15 -exec cp {} crash-reports/ \; 2>/dev/null || true
          ls -la crash-reports || true
          echo "--- DiagnosticReports dir contents ---"
          ls -la "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null || echo "missing"

      # The runner's ReportCrash produces no .ips files, so rebuild the Debug tests
      # (full symbols) and re-run the crashing test under lldb in batch mode; -k
      # commands fire when the process stops on the abort.
      - name: Backtrace under lldb
        if: failure()
        run: |
          swift build --build-tests 2>&1 | tail -2
          DEVELOPER_DIR="$(xcode-select -p)"
          BUNDLE=".build/out/Products/Debug/ntfyxCoreTests.xctest"
          echo "bundle=$BUNDLE"
          xcrun lldb --batch \
            -o run \
            -k "bt all" \
            -k "quit" \
            -- taskpolicy -B "$DEVELOPER_DIR/usr/bin/xctest" -XCTest "CloudChangeObserverTests/testBurstCoalescesIntoOneDebouncedEvent" "$BUNDLE" 2>&1 | tail -200

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports
          path: crash-reports
          if-no-files-found: ignore

      - name: Test Summary
        if: always()
        run: |
          total=$(grep -oE "Executed [0-9]+ tests" test-output.txt 2>/dev/null | tail -1 | grep -oE "[0-9]+" || true)
          failures=$(grep -oE "with [0-9]+ failure" test-output.txt 2>/dev/null | tail -1 | grep -oE "[0-9]+" || true)
          {
            echo "### Tests"
            echo ""
            echo "| Executed | Failures | Toolchain |"
            echo "| --- | --- | --- |"
            echo "| ${total:-not reported} | ${failures:-not reported} | $(swift --version 2>&1 | head -1) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-output.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -5 test-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ntfyx
          path: .build/release/ntfyx
