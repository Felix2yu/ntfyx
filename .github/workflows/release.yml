name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # Xcode 26 or newer: Package.swift needs swift-tools-version 6.2 and the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # Tags reach the shell steps below, so only a plain vSEMVER is usable.
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to release from tag '$VERSION'; expected the form vX.Y.Z" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Info.plist version from tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          VERSION_CLEAN="${VERSION#v}"
          BUILD="${VERSION_CLEAN//./}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION_CLEAN}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD}" Resources/Info.plist

      - name: Run tests
        run: swift test
      
      - name: Build and Sign app bundle
        run: |
          chmod +x build-app.sh
          ./build-app.sh
      
      - name: Create app archive
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cd .build/release
          tar -czf "ntfyx-${VERSION}.tar.gz" ntfyx.app
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: .build/release/ntfyx-${{ steps.version.outputs.VERSION }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify via ntfy
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_RELEASE_TOPIC }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_RELEASE_TOPIC not set, skipping notification"
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            curl -s -X POST "https://ntfy.sh/$NTFY_TOPIC" \
              -H "Title: ntfyx ${VERSION} released" \
              -H "Priority: 3" \
              -H "Tags: tada,rocket" \
              -d "Release ${VERSION} published successfully."
          else
            curl -s -X POST "https://ntfy.sh/$NTFY_TOPIC" \
              -H "Title: ntfyx ${VERSION} release failed" \
              -H "Priority: 4" \
              -H "Tags: x,warning" \
              -d "Release workflow failed for ${VERSION}. Check: https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"
          fi