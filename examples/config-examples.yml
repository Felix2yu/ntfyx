# ntfyx 配置示例
# 将相关片段复制到 ~/.config/ntfyx/config.yml
#
# 注意：配置中的未知键会在菜单栏触发警告。
# 这有助于发现诸如 "icon_path" 误写成 "iconpath"、或选项放错位置之类的拼写错误。

# 在 localhost 上启用本地通知服务器（可选）
# 脚本可向 http://127.0.0.1:9292/notify 发送 POST 请求来触发通知
# local_server_port: 9292

servers:
  # ===========================================
  # 智能家居（Home Assistant）
  # ===========================================
  - url: https://ntfy.sh
    # 安全策略：仅允许 homeassistant:// 和 https 链接
    # 注意：allowed_schemes 会替换默认值——此处 http 被禁止
    allowed_schemes:
      - https
      - homeassistant
    topics:
      - name: homeassistant-alerts
        display_name: "智能家居告警"  # 界面显示这个名字；主题 id 只能是英文
        icon_path: /Users/you/icons/homeassistant.png
        actions:
          - title: "打开 Home Assistant"
            type: view
            url: "homeassistant://"
          - title: "查看摄像头"
            type: view
            url: "homeassistant://navigate/lovelace/cameras"

  # ===========================================
  # CI/CD 流水线通知
  # ===========================================
  # 重要：脚本类动作务必配合带认证的私有服务器使用
  # 切勿在公共 ntfy.sh 上使用 auto_run_script 或 script 动作
  - url: https://ntfy.yourcompany.com
    token: tk_cicd_token
    topics:
      - name: github-actions
        icon_symbol: hammer.fill
        actions:
          - title: "打开 GitHub"
            type: view
            url: "https://github.com/youruser/yourrepo/actions"
          - title: "部署"
            type: script
            path: /usr/local/bin/deploy.sh

      - name: gitlab-ci
        icon_symbol: arrow.triangle.branch
        actions:
          - title: "打开流水线"
            type: view
            url: "https://gitlab.com/yourgroup/yourproject/-/pipelines"

  # ===========================================
  # 服务器监控
  # ===========================================
  - url: https://ntfy.myserver.com
    token: tk_yourtoken
    topics:
      - name: server-alerts
        icon_symbol: server.rack
        actions:
          - title: "SSH 连接服务器"
            type: script
            path: /usr/local/bin/open-ssh.sh
          - title: "查看 Grafana"
            type: view
            url: "https://grafana.myserver.com"

      - name: disk-alerts
        icon_symbol: externaldrive.fill
        auto_run_script: /usr/local/bin/disk-cleanup.sh
        actions:
          - title: "查看仪表盘"
            type: view
            url: "https://grafana.myserver.com/d/disk"

  # ===========================================
  # NAS / 群晖（Synology）
  # ===========================================
  - url: https://ntfy.sh
    topics:
      - name: synology
        icon_path: /Users/you/icons/synology.png
        actions:
          - title: "打开 DSM"
            type: view
            url: "https://nas.local:5001"
          - title: "Download Station"
            type: view
            url: "https://nas.local:5001/webman/index.cgi?launchApp=SYNO.SDS.DownloadStation.Application"

  # ===========================================
  # 软件包更新（仅 view 动作——公共服务器安全可用）
  # ===========================================
  - url: https://ntfy.sh
    topics:
      - name: yt-dlp-releases
        icon_symbol: arrow.down.circle.fill
        click_url: "https://github.com/yt-dlp/yt-dlp/releases"

      - name: homebrew-updates
        icon_symbol: mug.fill
        actions:
          - title: "查看更新日志"
            type: view
            url: "https://github.com/Homebrew/brew/releases"

  # ===========================================
  # 软件包更新（带自动更新脚本——私有服务器）
  # ===========================================
  - url: https://ntfy.home.local
    token: tk_updates_token
    topics:
      - name: yt-dlp-releases
        icon_symbol: arrow.down.circle.fill
        auto_run_script: /usr/local/bin/update-yt-dlp.sh

      - name: homebrew-updates
        icon_symbol: mug.fill
        auto_run_script: /usr/local/bin/brew-upgrade.sh

  # ===========================================
  # 安全告警（脚本动作必须使用私有服务器）
  # ===========================================
  - url: https://ntfy.secure.local
    token: tk_security_token
    topics:
      - name: security-alerts
        icon_symbol: lock.shield.fill
        actions:
          - title: "查看日志"
            type: script
            path: /usr/local/bin/view-security-logs.sh
          - title: "封禁 IP"
            type: script
            path: /usr/local/bin/block-ip.sh

  # ===========================================
  # 后台处理（静默）——需使用私有服务器
  # ===========================================
  - url: https://ntfy.home.local
    token: tk_automation_token
    topics:
      - name: backup-trigger
        silent: true
        auto_run_script: /usr/local/bin/run-backup.sh

      - name: sync-trigger
        silent: true
        auto_run_script: /usr/local/bin/sync-files.sh

  # ===========================================
  # 智能家居设备（脚本动作需使用私有服务器）
  # ===========================================
  - url: https://ntfy.home.local
    token: tk_smarthome_token
    topics:
      - name: doorbell
        icon_symbol: video.doorbell.fill
        actions:
          - title: "查看摄像头"
            type: view
            url: "https://cameras.home.local/doorbell"
          - title: "开锁"
            type: script
            path: /usr/local/bin/unlock-door.sh

      - name: garage
        icon_symbol: car.fill
        actions:
          - title: "打开车库门"
            type: script
            path: /usr/local/bin/garage-toggle.sh

  # ===========================================
  # 开发工具（脚本动作需使用私有服务器）
  # ===========================================
  - url: https://ntfy.dev.local
    token: tk_dev_token
    topics:
      - name: build-complete
        icon_symbol: checkmark.circle.fill
        actions:
          - title: "打开 Xcode"
            type: view
            url: "xcode://"
          - title: "运行测试"
            type: script
            path: /usr/local/bin/run-tests.sh

      - name: pr-review
        icon_symbol: arrow.triangle.pull
        actions:
          - title: "打开 PR"
            type: view
            url: "https://github.com/pulls"

  # ===========================================
  # macOS 快捷指令集成
  # ===========================================
  - url: https://ntfy.home.local
    token: tk_shortcuts_token
    topics:
      - name: automation
        icon_symbol: wand.and.stars
        actions:
          - title: "运行快捷指令"
            type: shortcut
            name: "My Automation Shortcut"
          - title: "专注模式"
            type: shortcut
            name: "Toggle Focus Mode"

  # ===========================================
  # AppleScript 动作
  # ===========================================
  - url: https://ntfy.home.local
    token: tk_applescript_token
    topics:
      - name: media-control
        icon_symbol: play.circle.fill
        actions:
          # 内联 AppleScript
          - title: "暂停音乐"
            type: applescript
            script: 'tell application "Music" to pause'
          # AppleScript 文件
          - title: "运行工作流"
            type: applescript
            path: /Users/you/Scripts/workflow.scpt

  # ===========================================
  # 拉取离线期间错过的消息
  # ===========================================
  # 拉取应用未运行期间到达的消息
  - url: https://ntfy.myserver.com
    token: tk_yourtoken
    fetch_missed: true  # 对该服务器上所有主题启用
    topics:
      - name: important-alerts
        icon_symbol: exclamationmark.triangle.fill
      - name: low-priority
        fetch_missed: false  # 覆盖：对该主题禁用

  # ===========================================
  # 链接安全（allowed_schemes 与 allowed_domains）
  # ===========================================
  # 限制通知中可以打开哪些链接
  - url: https://ntfy.sh
    # 仅允许指向特定域名的 https 链接
    allowed_schemes:
      - https
    allowed_domains:
      - github.com
      - "*.example.com"  # 支持通配符
    topics:
      - name: restricted-alerts
        icon_symbol: lock.fill
        click_url: "https://github.com/myorg/myrepo"

  # 允许自定义 app scheme（如 Home Assistant）
  - url: https://ntfy.home.local
    allowed_schemes:
      - https
      - homeassistant
      - ssh  # 允许 ssh:// 链接
    topics:
      - name: home-automation
        icon_symbol: house.fill
        click_url: "homeassistant://"
